[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tarot-cli"
version = "0.2.0"
description = "Generate symbolic tarot cards, verify their titles, and upload them to Google Drive."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
tarot = "tarot_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
